name: dnipro-alert-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dnipro_alert
      POSTGRES_USER: dnipro_alert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dnipro_alert_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnipro_alert -d dnipro_alert"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  dnipro_alert_data:
